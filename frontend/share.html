<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>方案分享 · cloudsol.cn</title>
    <style>
        :root {
            --primary-color: #C7000B;
            --primary-color-06: rgba(199, 0, 11, 0.06);
            --text-primary: #1D2129;
            --text-secondary: #4E5969;
            --text-muted: #86909C;
            --bg: #F5F6F8;
            --card-bg: #FFFFFF;
            --border: #E5E6EB;
            --neutral-300: #F7F8FA;
            --neutral-400: #F2F3F5;
            --font-size-sm: 14px;
        }
        * { box-sizing: border-box; }
        body {
            margin: 0;
            background: var(--bg);
            font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif;
            color: var(--text-primary);
            line-height: 1.7;
        }
        .share-topbar {
            height: 52px;
            background: var(--primary-color);
            color: #fff;
            display: flex;
            align-items: center;
            padding: 0 20px;
            font-size: 15px;
            font-weight: 600;
            letter-spacing: 0.5px;
        }
        .share-topbar a {
            color: #fff;
            text-decoration: none;
            margin-left: auto;
            font-size: 13px;
            font-weight: 400;
            opacity: 0.92;
        }
        .topbar-title {
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
            flex: 1;
            min-width: 0;
        }
        .share-container { max-width: 920px; margin: 0 auto; padding: 24px 16px 64px; }
        .share-state { text-align: center; padding: 80px 0; color: var(--text-muted); font-size: 15px; }
        .share-card {
            background: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 28px 32px;
            box-shadow: 0 2px 12px rgba(0, 0, 0, 0.04);
        }
        .share-kind-badge {
            display: inline-block;
            background: var(--primary-color-06);
            color: var(--primary-color);
            border: 1px solid rgba(199, 0, 11, 0.15);
            font-size: 12px;
            padding: 2px 10px;
            border-radius: 999px;
            margin-bottom: 12px;
        }
        .share-title { font-size: 24px; font-weight: 700; margin: 0 0 8px; line-height: 1.35; }
        .share-meta { color: var(--text-muted); font-size: 13px; margin-bottom: 4px; }
        .share-meta span { margin-right: 16px; }
        .share-section-label {
            display: inline-block;
            font-size: 13px;
            font-weight: 600;
            color: var(--primary-color);
            border-left: 3px solid var(--primary-color);
            padding-left: 8px;
            margin: 22px 0 8px;
        }
        .share-demand-box {
            background: var(--neutral-300);
            border: 1px solid var(--neutral-400);
            border-radius: 8px;
            padding: 12px 16px;
            font-size: 14px;
            color: var(--text-secondary);
            white-space: pre-wrap;
        }
        .result-content { font-size: 15px; }
        .result-content h2 { font-size: 21px; margin: 20px 0 12px; }
        .result-content h3 { font-size: 18px; margin: 18px 0 10px; }
        .result-content h4 { font-size: 16px; margin: 16px 0 8px; }
        .result-content p { margin: 8px 0; }
        .markdown-table { width: 100%; border-collapse: collapse; margin: 12px 0; font-size: var(--font-size-sm, 14px); border: 1px solid #d9d9d9; }
        .markdown-table th {
            border: 1px solid #d9d9d9;
            border-bottom: 2px solid rgba(199, 0, 11, 0.15);
            padding: 10px 14px;
            text-align: left;
            background: rgba(199, 0, 11, 0.06);
            color: #1f2329;
            font-weight: 600;
        }
        .markdown-table td { border: 1px solid #e8e8e8; padding: 10px 14px; color: #333; }
        .share-sources { font-size: 13px; color: var(--text-secondary); }
        .share-sources .source-item { padding: 8px 0; border-bottom: 1px dashed var(--border); }
        .share-sources .source-item:last-child { border-bottom: none; }
        .share-qr-card {
            margin-top: 32px;
            text-align: center;
            border-top: 1px dashed var(--border);
            padding-top: 24px;
        }
        .share-qr-inner {
            display: inline-block;
            border: 2px solid var(--primary-color);
            border-radius: 12px;
            padding: 14px;
            background: #fff;
        }
        #share-qrcode svg { width: 176px; height: 176px; display: block; }
        .share-qr-tip { color: var(--text-muted); font-size: 13px; margin-top: 10px; }
        .share-foot { text-align: center; color: var(--text-muted); font-size: 12px; margin-top: 28px; }
        @media (max-width: 600px) {
            .share-card { padding: 20px 16px; }
            .share-title { font-size: 20px; }
            .share-container { padding: 16px 12px 48px; }
            .share-topbar {
                height: 44px;
                padding: 0 14px;
                font-size: 13px;
                letter-spacing: 0;
            }
            .topbar-title {
                max-width: 58%;
                font-size: 12px;
            }
            .topbar-link { font-size: 11px; }
            .topbar-title,
            .topbar-link { font-size: 0; }
            .topbar-title::before {
                content: attr(data-short);
                font-size: 12px;
            }
            .topbar-link::before {
                content: attr(data-short);
                font-size: 11px;
            }
            #share-qrcode svg { width: 140px; height: 140px; }
            .share-qr-inner { padding: 10px; }
        }
    </style>
</head>
<body>
    <div class="share-topbar">
        <span class="topbar-title" data-short="方案分享（只读）">cloudsol.cn · 华为云解决方案分享（只读）</span>
        <a href="/" target="_blank" class="topbar-link" data-short="工作台 →">打开完整工作台 →</a>
    </div>
    <div class="share-container">
        <div id="share-state" class="share-state">加载中…</div>
        <div id="share-body" class="share-card" style="display:none;"></div>
        <div class="share-foot">由 cloudsol.cn 智能匹配生成 · 本页为只读分享，不含任何账号信息</div>
    </div>
    <script src="js/vendor/qrcode.js"></script>
    <script src="js/share.js"></script>
</body>
</html>
