[program:huawei-cloud-api]
; 必须单 worker：KB 重建任务状态存进程内存(_task_store)、并发锁(_user_sync_locks)为进程内全局，
; 多 worker 会导致轮询任务 404、锁失效、SQLite 并发写 "database is locked"。切勿添加 --workers。
command=/var/www/huawei-cloud-solution-matcher/venv/bin/python -m uvicorn api.main:app --host 127.0.0.1 --port 8000
directory=/var/www/huawei-cloud-solution-matcher
user=www-data
autostart=true
autorestart=true
redirect_stderr=true
stdout_logfile=/var/log/supervisor/huawei-cloud-api.log
stdout_logfile_maxbytes=50MB
stdout_logfile_backups=10
environment=PATH="/var/www/huawei-cloud-solution-matcher/venv/bin:%(ENV_PATH)s"
